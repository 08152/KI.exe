<body>

<div class="app">

    <header>
        <div class="logo">Meine AI</div>
        <div class="status">● Online</div>
    </header>

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <h1>Meine AI</h1>
            <p>Deine eigene künstliche Intelligenz</p>
        </div>

    </main>

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                placeholder="Schreibe eine Nachricht..."
                rows="1"
            ></textarea>

            <button id="send">➤</button>

        </div>

    </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


function generateAnswer(text) {

    const lower = text.toLowerCase();

    if (lower.includes("hallo") ||
        lower.includes("hi") ||
        lower.includes("hey")) {

        return "Hallo! Ich bin deine eigene AI.";
    }

    if (lower.includes("wie geht")) {

        return "Mir geht es gut! Ich bin bereit.";
    }

    if (lower.includes("wer bist du")) {

        return "Ich bin deine eigene künstliche Intelligenz.";
    }

    if (lower.includes("was kannst du")) {

        return "Ich kann mit dir chatten. Mein neuronales Modell wird später direkt mit dieser Oberfläche verbunden.";
    }

    return "Ich habe deine Nachricht erhalten: " + text;
}


function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {

        const answer = generateAnswer(text);

        addMessage(answer, "ai");

    }, 300);
}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);

</script>

</body>
</html>
